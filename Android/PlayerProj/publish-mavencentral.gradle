apply plugin: 'maven-publish'
apply plugin: 'signing'

def publishingProperties = new Properties()
def localProperties = rootProject.layout.projectDirectory.file('local.properties')
def localPropertiesText = providers.fileContents(localProperties).asText.orNull
if (localPropertiesText != null) {
    publishingProperties.load(new StringReader(localPropertiesText))
}

def centralGroup = 'io.github.qqnp1100'
def centralArtifact = 'vap'
def centralVersion = providers.gradleProperty('vapPublishingVersion').orElse('2.0.30').get()
if (!(centralVersion ==~ /[0-9]+\.[0-9]+\.[0-9]+/)) {
    throw new GradleException('vapPublishingVersion must be a release version such as 2.0.30.')
}

def scmUrl = 'https://github.com/qqnp1100/vap'
def stagingRepository = layout.buildDirectory.dir('central/repository')
def artifactPath = "${centralGroup.replace('.', '/')}/${centralArtifact}/${centralVersion}"

android {
    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

def docsJar = tasks.register('centralJavadocJar', Jar) {
    archiveClassifier = 'javadoc'
    from(rootProject.file('../README.md'))
    from(rootProject.file('../../LICENSE.txt'))
}

def releasePublication = publishing.publications.register('release', MavenPublication) {
    groupId = centralGroup
    artifactId = centralArtifact
    version = centralVersion
    artifact(docsJar)

    pom {
        name = 'VAP'
        description = 'Android player for Tencent Video Animation Player (VAP) files.'
        url = scmUrl
        licenses {
            license {
                name = 'MIT License'
                url = 'https://opensource.org/license/mit'
            }
        }
        developers {
            developer {
                id = 'qqnp1100'
                name = 'xzin'
                url = 'https://github.com/qqnp1100'
            }
        }
        scm {
            url = scmUrl
            connection = "scm:git:${scmUrl}.git"
            developerConnection = 'scm:git:ssh://git@github.com/qqnp1100/vap.git'
        }
    }
}

publishing.repositories.maven {
    name = 'CentralStaging'
    url = stagingRepository
}

afterEvaluate {
    releasePublication.configure {
        from components.release
    }
}

signing {
    def keyFile = publishingProperties.getProperty('SIGNING_KEY_FILE')
    if (keyFile) {
        useInMemoryPgpKeys(
            publishingProperties.getProperty('SIGNING_KEY_ID') ?: null,
            file(keyFile).getText('UTF-8'),
            publishingProperties.getProperty('SIGNING_PASSWORD', '')
        )
    }
    sign releasePublication.get()
}

tasks.named('signReleasePublication', Sign) {
    doFirst {
        if (!signatory) {
            throw new GradleException('Set SIGNING_KEY_FILE and SIGNING_PASSWORD in local.properties.')
        }
    }
}

def cleanStaging = tasks.register('cleanCentralStaging', Delete) {
    delete stagingRepository
}

tasks.named('publishReleasePublicationToCentralStagingRepository') {
    dependsOn cleanStaging
}

def centralBundle = tasks.register('centralBundle', Zip) {
    group = 'publishing'
    description = 'Builds a signed Maven Central bundle without uploading it.'
    dependsOn 'publishReleasePublicationToCentralStagingRepository'
    from(stagingRepository) {
        include "${artifactPath}/*"
        exclude '*.asc.*', '**/*.asc.*'
    }
    archiveFileName = "${centralArtifact}-${centralVersion}"
    destinationDirectory = layout.buildDirectory.dir('central')
}

tasks.register('publishToMavenCentral', Exec) {
    group = 'publishing'
    description = 'Uploads the signed bundle to Central Portal for manual release.'
    dependsOn centralBundle

    doFirst {
        def username = publishingProperties.getProperty('MAVEN_CENTRAL_USERNAME')
        def password = publishingProperties.getProperty('MAVEN_CENTRAL_PASSWORD')
        if (!username || !password) {
            throw new GradleException('Set MAVEN_CENTRAL_USERNAME and MAVEN_CENTRAL_PASSWORD in local.properties.')
        }
        def token = "${username}:${password}".getBytes('UTF-8').encodeBase64().toString()
        // Pass the bearer token via stdin so it does not appear in the command line.
        standardInput = new ByteArrayInputStream("Authorization: Bearer ${token}\n".getBytes('UTF-8'))
        def bundle = centralBundle.get().archiveFile.get().asFile
        workingDir bundle.parentFile
        commandLine 'curl', '--disable', '--silent', '--show-error', '--fail-with-body',
            '--connect-timeout', '15', '--max-time', '300',
            '--header', '@-', '--form', "bundle=@${bundle.name};type=application/octet-stream",
            'https://central.sonatype.com/api/v1/publisher/upload?publishingType=USER_MANAGED'
    }
}
